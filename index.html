  <!-- ═══════════ RENDER CONTENT ═══════════ -->
  <script>
    /**
     * renderContent()  –  Liest CONTENT aus content.js und
     * befüllt alle HTML-Container via getElementById().innerHTML.
     * So kann ein Laie Texte in content.js ändern, ohne
     * die HTML-Struktur anfassen zu müssen.
     */
    function renderContent() {
      const C = CONTENT;
      const $ = (id) => document.getElementById(id);

      /* ── Meta ── */
      document.title = C.meta.title;
      $("page-description")?.setAttribute("content", C.meta.description);

      /* ── Nav ── */
      $("header-logo").src = C.images.logo;
      $("header-logo").alt = "Logo " + C.nav.brand;
      $("nav-brand").textContent = C.nav.brand;
      $("header-phone").href = C.nav.phoneHref;
      $("header-phone").textContent = C.nav.phone;

      // Desktop-Nav
      const desktopNav = $("desktop-nav");
      desktopNav.innerHTML = C.nav.links
        .map(l => `<a href="${l.href}" class="text-sm font-medium text-stone-700 transition hover:text-sage-600">${l.label}</a>`)
        .join("");

      // Mobile-Nav
      const mobileNav = $("mobile-nav");
      mobileNav.innerHTML = C.nav.links
        .map(l => `<a href="${l.href}" class="mobile-nav-link">${l.label}</a>`)
        .join("") +
        `<a href="${C.nav.phoneHref}" class="btn-primary mt-6 w-full justify-center">${C.nav.phone}</a>`;

      /* ── Hero ── */
      $("hero-badge").textContent = C.hero.badge;
      $("hero-title").textContent = C.hero.title;
      $("hero-subtitle").textContent = C.hero.subtitle;
      $("hero-subtitle-hl").textContent = C.hero.subtitleHighlight;
      $("hero-text").textContent = C.hero.text;
      $("hero-cta1").textContent = C.hero.cta1;
      $("hero-cta2").textContent = C.hero.cta2;
      $("hero-highlights").innerHTML = C.hero.highlights
        .map(h => `<li class="flex items-start gap-2"><span class="text-sage-500 mt-0.5">✓</span> ${h}</li>`)
        .join("");
      $("hero-image").src = C.images.praxisAussen;
      $("hero-image").alt = "Praxis Gesund und Fröhlich";

      $("osteo-kassen").textContent = C.osteopathie.kassen;
      $("osteo-kassen-hinweis").textContent = C.osteopathie.kassenHinweis;
      $("osteo-img").src = C.images.osteopathieInfo;
      $("osteo-img").alt = "Osteopathische Behandlung";

      $("osteo-saeugling-img").src = C.images.saeugling;
      $("osteo-saeugling-img").alt = "Säuglingsbehandlung";

      /* ── Matrix ── */
      $("matrix-title").textContent = C.matrix.title;
      $("matrix-quote").textContent = C.matrix.quote;
      $("matrix-text1").textContent = C.matrix.text1;
      $("matrix-text2").textContent = C.matrix.text2;
      $("matrix-funktion-title").textContent = C.matrix.funktionTitle;
      $("matrix-funktion-text").textContent = C.matrix.funktionText;
      $("matrix-hinweis").textContent = C.matrix.hinweis;

      $("matrix-anwendungen").innerHTML = C.matrix.anwendungen
        .map(a => `<li class="flex items-start gap-2"><span class="text-sage-500 shrink-0">•</span> ${a}</li>`)
        .join("");

      /* ── Portrait ── */
      $("portrait-title").textContent = C.portrait.title;
      $("portrait-team-img").src = C.images.teamFull;
      $("portrait-team-img").alt = "Praxisteam";
      $("portrait-lead").textContent = C.portrait.lead;
      $("portrait-intro").textContent = C.portrait.teamIntro;
      $("portrait-philosophy").textContent = C.portrait.philosophy;
      $("portrait-cta").textContent = C.portrait.cta;
      $("portrait-section-title").textContent = C.portrait.sectionTitle;

      $("portrait-members").innerHTML = C.portrait.members
        .map((m, i) => `
          <article class="rounded-2xl border border-stone-200 bg-white shadow-calm overflow-hidden fade-up">
            <div class="p-4 flex justify-center bg-sage-50">
              <img
                src="${i === 0 ? C.images.timPortrait : C.images.katrinPortrait}"
                alt="${m.name}"
                class="img-portrait max-h-[520px]"
                loading="lazy"
              />
            </div>
            <div class="p-6">
              <h4 class="text-xl font-bold text-stone-900">${m.name}</h4>
              <ul class="mt-3 space-y-1 text-sm text-stone-600">
                ${m.qualifications.map(q => `<li class="flex items-start gap-2"><span class="text-sage-500 shrink-0">•</span> ${q}</li>`).join("")}
              </ul>
              <blockquote class="mt-4 text-sm italic text-sage-600 border-l-2 border-sage-300 pl-3">${m.quote}</blockquote>
              <blockquote class="mt-2 text-xs italic text-stone-500 border-l-2 border-stone-200 pl-3">${m.quoteOsteo}</blockquote>
            </div>
          </article>
        `).join("");

      /* ── Praxis ── */
      $("praxis-title").textContent = C.praxis.title;
      $("praxis-lead").textContent = C.praxis.lead;
      $("praxis-gallery").innerHTML = C.praxis.gallery
        .map(img => `<img src="${img.src}" alt="${img.alt}" class="img-natural fade-up" loading="lazy" />`)
        .join("");

      /* ── FAQ ── */
      $("faq-title").textContent = C.faq.title;
      $("faq-list").innerHTML = C.faq.items

          <div class="faq-item" data-faq="${i}">
            <button class="faq-question" type="button" aria-expanded="false">
              <span>${item.q}</span>
              <svg class="faq-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
            </button>
            <div class="faq-answer"><p>${item.a}</p></div>

      $("faq-cta").textContent = C.faq.cta;

      /* ── Kontakt ── */
      $("kontakt-title").textContent = C.kontakt.title;
      $("kontakt-lead").textContent = C.kontakt.lead;
      $("kontakt-phone").href = C.kontakt.phoneHref;
      $("kontakt-phone").textContent = C.kontakt.phone;
      $("kontakt-email").href = C.kontakt.emailHref;
      $("kontakt-email").textContent = C.kontakt.email;
      $("kontakt-address").textContent = C.kontakt.address;
      $("kontakt-address-detail").textContent = " (" + C.kontakt.addressDetail + ")";
      $("kontakt-wa").href = C.kontakt.whatsapp;
      $("kontakt-sms").href = C.kontakt.sms;
      $("kontakt-call").href = C.kontakt.phoneHref;
      $("kontakt-praxis-img").src = C.images.visitenkarte;
      $("kontakt-praxis-img").alt = "Visitenkarte Gesund und Fröhlich";

      $("kontakt-hours").innerHTML = C.kontakt.hours
        .map(h => `<dt class="font-medium">${h.day}</dt><dd>${h.time}</dd>`)
        .join("");

      // Form labels
      $("label-name").textContent = C.kontakt.formLabels.name + "*";
      $("label-email").textContent = C.kontakt.formLabels.email + "*";
      $("label-phone").textContent = C.kontakt.formLabels.phone + "*";

      $("form-submit").textContent = C.kontakt.formLabels.submit;
      $("form-consent").textContent = C.kontakt.formLabels.consent;

      /* ── Footer ── */
      $("footer-logo").src = C.images.footerLogo;
      $("footer-logo").alt = "Logo " + C.nav.brand;
      $("footer-copyright").textContent = C.footer.copyright;
      $("footer-address").textContent = C.footer.address;
      $("footer-links").innerHTML = C.footer.links
        .map(l => `<a href="${l.href}" class="underline underline-offset-4 hover:text-sage-600">${l.label}</a>`)
        .join("");
    }

    /* ═══ INITIALISIERUNG ═══ */
    document.addEventListener("DOMContentLoaded", () => {
      /* 1. Inhalte rendern */
      renderContent();

      /* 2. Mobile Navigation */
      const burger = document.getElementById("burger");
      const overlay = document.getElementById("mobile-overlay");
      const panel = document.getElementById("mobile-panel");
      const closeBtn = document.getElementById("mobile-close");

      const openMobile = () => { overlay.classList.add("open"); panel.classList.add("open"); document.body.style.overflow = "hidden"; };
      const closeMobile = () => { overlay.classList.remove("open"); panel.classList.remove("open"); document.body.style.overflow = ""; };

      burger.addEventListener("click", openMobile);
      overlay.addEventListener("click", closeMobile);
      closeBtn.addEventListener("click", closeMobile);
      panel.querySelectorAll("a").forEach(a => a.addEventListener("click", closeMobile));

      /* 3. Scrollende Header-Shadow */
      const header = document.getElementById("site-header");
      const onScroll = () => header.classList.toggle("scrolled", window.scrollY > 20);
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();

      /* 4. Smooth-Scroll für Anker */
      document.querySelectorAll('a[href^="#"]').forEach(link => {
        link.addEventListener("click", e => {
          const id = link.getAttribute("href");
          if (!id || id === "#") return;
          const target = document.querySelector(id);
          if (!target) return;
          e.preventDefault();
          const offset = header.offsetHeight + 8;
          const top = target.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top, behavior: "smooth" });
        });
      });

      /* 5. FAQ Accordion */
      document.querySelectorAll(".faq-item").forEach(item => {
        const btn = item.querySelector(".faq-question");
        btn.addEventListener("click", () => {
          const isOpen = item.classList.contains("open");
          // Alle schließen
          document.querySelectorAll(".faq-item.open").forEach(i => {
            i.classList.remove("open");
            i.querySelector(".faq-question").setAttribute("aria-expanded", "false");
          });
          if (!isOpen) {
            item.classList.add("open");
            btn.setAttribute("aria-expanded", "true");
          }
        });
      });

      /* 6. Kontaktformular */
      const form = document.getElementById("contactForm");
      const msgInput = document.getElementById("f-message");
      const charCount = document.getElementById("charCount");
      const formMessage = document.getElementById("formMessage");

      const updateCount = () => { charCount.textContent = `${msgInput.value.length} / 700`; };
      updateCount();
      msgInput.addEventListener("input", updateCount);

      // Live-Validierung
      form.querySelectorAll("input[required], textarea[required]").forEach(field => {
        const check = () => field.classList.toggle("invalid", field.value.trim() !== "" && !field.checkValidity());
        field.addEventListener("blur", check);
        field.addEventListener("input", check);
      });

      form.addEventListener("submit", e => {
        e.preventDefault();
        if (!form.checkValidity()) {
          formMessage.textContent = "Bitte füllen Sie alle Pflichtfelder korrekt aus.";
          formMessage.style.color = "#ef4444";
          form.reportValidity();
          return;
        }
        const name = document.getElementById("f-name").value.trim();
        const email = document.getElementById("f-email").value.trim();
        const phone = document.getElementById("f-phone").value.trim();
        const message = msgInput.value.trim();

        const subject = encodeURIComponent("Terminanfrage über Website");
        const body = encodeURIComponent(
          `Name: ${name}\nE-Mail: ${email}\nTelefon: ${phone}\n\nNachricht:\n${message}`
        );
        window.location.href = `mailto:${CONTENT.kontakt.email}?subject=${subject}&body=${body}`;

        formMessage.textContent = "Ihr E-Mail-Programm wird geöffnet. Vielen Dank!";
        formMessage.style.color = "#4e6b4b";
      });

      /* 7. Scroll-Animationen (Intersection Observer) */
      const observerOptions = { threshold: 0.12, rootMargin: "0px 0px -40px 0px" };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, observerOptions);

      document.querySelectorAll(".fade-up").forEach(el => observer.observe(el));
    });
  </script>
